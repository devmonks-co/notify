name: Release

# Publishes to npm when a v* tag is pushed. Uses npm trusted publishing (OIDC): no npm token,
# no 2FA prompt, and the package gets provenance. Configure the trusted publisher once on
# npmjs.com: @devmonks/notify → Settings → Trusted Publisher → GitHub Actions,
# org devmonks-co, repo notify, workflow release.yml.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --access public --provenance
